# Netz-Isolation: der Daemon selbst bekommt keinen Netzzugang mehr.
#
# Warum PrivateNetwork und nicht IPAddressDeny: gemessen am 2026-08-17 unter
# systemd 261 wirkt IPAddressDeny=any in User-Units NICHT (die Verbindung kam
# durch), PrivateNetwork=yes schon - in der Unit existiert dann nur noch `lo`.
#
# Warum CW_RUN_LAUNCHER=service dazugehoert: ein mit `systemd-run --scope`
# gestarteter Lauf ist ein Kind des Daemons und erbt dessen Netzwerk-Namespace.
# Ein transienter Dienst wird dagegen vom User-Manager gestartet und erbt ihn
# nicht. Ohne diese Zeile koennte der Watchdog zwar weiter beobachten, aber
# keinen managed-Lauf mehr starten, der die API erreicht.
#
# Was weiterhin funktioniert (nachgemessen): `claude agents --json`,
# notify-send ueber D-Bus, systemd-run ueber D-Bus - alles Unix-Sockets.
[Service]
PrivateNetwork=yes
Environment=CW_RUN_LAUNCHER=service

# Ohne Netz ist der Rest fast geschenkt. Bewusst NICHT dabei:
# RestrictAddressFamilies und SystemCallFilter - beides sind seccomp-Filter,
# die an jedes Kind vererbt werden und sich nicht mehr ablegen lassen; sie
# wuerden `claude agents --json` und den Node-JIT treffen.
NoNewPrivileges=yes
ProtectSystem=strict
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
RestrictSUIDSGID=yes
LockPersonality=yes
